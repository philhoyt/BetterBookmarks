name: Release

on:
  push:
    tags:
      # Lowercase "v" only. Plugin Update Checker strips the prefix with
      # ltrim( $tag, 'v' ), which is case-sensitive: an uppercase "V1.2.3" tag
      # is left as-is and version_compare() ranks it BELOW the installed
      # version, so no update is ever offered.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            better-bookmarks.zip
            readme.txt
          generate_release_notes: true
